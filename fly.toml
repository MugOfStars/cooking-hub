# Fly.io deployment config. Secrets (DATABASE_URL, AUTH_PASSWORD_HASH, SESSION_SECRET)
# are set with `fly secrets set`, never in this file.
app = "chef-gavin"
primary_region = "iad"  # Ashburn, VA: next to the Neon database in AWS us-east-1

# Builds from the repo-root Dockerfile by default.

[deploy]
  # Runs in a temporary machine on the new image before it takes traffic.
  # If the migration fails, the deploy stops and the old version keeps running.
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine always on: no cold start when he opens it in the kitchen.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Liveness only (no DB), so these checks don't keep Neon from scaling to zero.
  [[http_service.checks]]
    method = "GET"
    path = "/api/live"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
