name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres just for this job. The credentials are CI-only, not secrets.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cooking_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d cooking_hub_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/cooking_hub_test

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # Proves the migrations apply cleanly to an empty database...
      - name: Apply migrations
        run: uv run alembic upgrade head

      # ...and that the models haven't drifted from the migrations.
      - name: Check models match migrations
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest

  deploy:
    # Only after tests pass, and only for pushes to main (never for pull requests).
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # If two pushes land close together, deploy them one at a time, in order.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      # Fly builds the image, runs the migration release_command, then swaps machines.
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
